name: 🚀 Build & Deploy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths-ignore: ['.vscode/**', 'README.md', '.*']
permissions:
  contents: write
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
